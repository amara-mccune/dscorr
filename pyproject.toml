[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dscorr"
version = "1.0.0"
description = "Massive de Sitter correlators as finite Mellin-Barnes integrals (code of the Letter)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amara McCune", email = "amaramccune@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "mpmath>=1.3",
]

[project.urls]
Repository = "https://github.com/amara-mccune/dscorr"

[project.optional-dependencies]
test = ["pytest>=7"]
figures = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/**/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running test",
]
addopts = "-m 'not slow'"
